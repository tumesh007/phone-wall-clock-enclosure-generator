plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pnb.smartclock'
    compileSdk 34

    defaultConfig {
        applicationId "com.pnb.smartclock"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero third-party dependencies required; android.webkit is built into the Android platform
}
